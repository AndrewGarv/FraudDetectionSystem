services:
  backend:
    build:
      context: ./backend
    container_name: fraud-backend
    ports:
      - "8000:8000"
    volumes:
      - fraud-db-data:/app/database

  frontend:
    build:
      context: ./frontend
    container_name: fraud-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  fraud-db-data:
    external: true